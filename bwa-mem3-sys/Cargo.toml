[package]
name = "bwa-mem3-sys"
description = "Low-level FFI bindings to bwa-mem3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["external-ffi-bindings", "science"]
keywords = ["bioinformatics", "bwa", "alignment", "ngs"]
links = "bwa-mem3"
readme = "README.md"
include = [
    "src/",
    "build.rs",
    "vendor/",
    "shim/",
    "patches/",
    "LICENSE",
    "README.md",
]

[lib]
path = "src/lib.rs"

[features]
default = []
sse42 = []
avx512 = []
native = []
# Compile the vendored pac-fetch path with `-DBWA_MEM3_DEBUG_POISON`, which
# 0xFF-fills each reference window in the per-thread scratch before the next
# fetch overwrites it (bntseq.cpp). A caller that stale-reads a prior window
# then produces garbage that trips the byte-parity suite, turning the
# single-live-window aliasing hazard into a test failure instead of a silent
# pass. Off by default; enabled by the debug-poison CI lane only.
debug-poison = []
# Re-run bindgen against shim/bwa_shim.h (needs libclang). The build fails if
# the output differs from the committed src/bindings.rs; set
# BWA_MEM3_SYS_WRITE_BINDINGS=1 to overwrite the committed file instead.
regenerate-bindings = ["dep:bindgen"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
bindgen = { version = "0.69", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
