name: Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    # Python static analysis (ruff format + lint). Pure source check — no
    # Rust toolchain or built extension needed, so it's a fast, standalone
    # gate that surfaces style/lint regressions without waiting on the
    # heavier wheel/integration build matrix (all jobs run concurrently).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bwa-mem3-py
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@8ca4608ef7f4daeb54f5205b20d0b7cb42f11143 # v0.8.1
        with:
          pixi-version: v0.71.0
          manifest-path: bwa-mem3-py/pixi.toml
          cache: true
      - name: Ruff format + lint
        run: pixi run check-all

  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-latest
            arch: aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bwa-mem3-py
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          workspaces: bwa-mem3-py
      - uses: prefix-dev/setup-pixi@8ca4608ef7f4daeb54f5205b20d0b7cb42f11143 # v0.8.1
        with:
          pixi-version: v0.71.0
          manifest-path: bwa-mem3-py/pixi.toml
          cache: true
      - name: Build & install editable extension
        run: pixi run develop
      - name: Build wheel artifact
        run: pixi run build
      - name: Smoke tests (no real index)
        run: pixi run pytest tests/test_smoke.py -v

  integration:
    # Full pytest suite (smoke + alignment) against a PhiX index built from
    # the same upstream bwa-mem3 commit we vendor. Linux-only because
    # bwa-mem3's Makefile and shm path are best-supported there; the wheel
    # matrix above still exercises macOS and arm64 builds with smoke tests.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bwa_arch: avx2
          - os: ubuntu-24.04-arm
            bwa_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libdeflate-dev \
            autoconf automake
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          workspaces: bwa-mem3-py
      # Mirrors check.yml's e2e job: blobless + depth-1 fetch of the vendored
      # SHA, build a single-arch binary. The vendored snapshot is pruned of
      # `ext/htslib`, `ext/libsais`, `ext/mimalloc`, etc. (the Rust crate
      # doesn't compile them), but upstream's Makefile does — so for the
      # bwa-mem3 binary we re-fetch with submodules.
      # TODO: switch back to `bioconda::bwa-mem3` once published.
      - name: Install clang-19 (verified LLVM apt repo)
        # The vendored bwa-mem3 Makefile requires clang >= 19 / gcc >= 15 (the
        # runner ships gcc 13), and clang's -fopenmp (libsais LIBSAIS_OPENMP)
        # needs libomp. Install from apt.llvm.org via a pinned repo whose signing
        # key is fingerprint-verified before use -- not `llvm.sh | sudo bash` --
        # so a tampered mirror or installer can't run code as root (CWE-494).
        # Mirrors fg-labs/bwa-mem3's release.yml.
        run: |
          set -euo pipefail
          . /etc/os-release
          codename="${VERSION_CODENAME:-$(lsb_release -cs)}"
          expected_fpr="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          got_fpr="$(gpg --show-keys --with-colons --with-fingerprint /tmp/llvm-snapshot.gpg.key | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ "$got_fpr" != "$expected_fpr" ]; then
            echo "FATAL: LLVM archive key fingerprint mismatch: got '$got_fpr', expected '$expected_fpr'" >&2
            exit 1
          fi
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo gpg --dearmor -o /etc/apt/keyrings/llvm-snapshot.gpg /tmp/llvm-snapshot.gpg.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          sudo apt-get install -y clang-19 libomp-19-dev
          clang++-19 --version | head -1
      - name: Build bwa-mem3 from upstream at vendored COMMIT
        run: |
          set -euo pipefail
          sha="$(cat bwa-mem3-sys/vendor/COMMIT)"
          git init /tmp/bwa-mem3
          git -C /tmp/bwa-mem3 remote add origin https://github.com/fg-labs/bwa-mem3.git
          git -C /tmp/bwa-mem3 fetch --filter=blob:none --no-tags --depth=1 origin "$sha"
          git -C /tmp/bwa-mem3 checkout FETCH_HEAD
          git -C /tmp/bwa-mem3 submodule update --init --recursive --depth 1
          # fg-labs/bwa-mem3#513 retired the pre-AVX2 x86 tiers, so x86 builds
          # arch=avx2; clang-19 satisfies the compiler floor.
          make -C /tmp/bwa-mem3 arch=${{ matrix.bwa_arch }} CXX=clang++-19 CC=clang-19 -j"$(nproc)" all
          echo "BWA_MEM3_BIN=/tmp/bwa-mem3/bwa-mem3" >> "$GITHUB_ENV"
      - uses: prefix-dev/setup-pixi@8ca4608ef7f4daeb54f5205b20d0b7cb42f11143 # v0.8.1
        with:
          pixi-version: v0.71.0
          manifest-path: bwa-mem3-py/pixi.toml
          cache: true
      - name: Build & install editable extension
        working-directory: bwa-mem3-py
        run: pixi run develop
      - name: Run full pytest suite (smoke + integration)
        working-directory: bwa-mem3-py
        run: pixi run pytest tests -v
