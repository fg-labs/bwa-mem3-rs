[package]
name = "bwa-mem3-py"
description = "Python bindings for bwa-mem3-rs"
# Inherited from [workspace.package] so this crate -- and the wheel maturin
# builds from it -- stays in lockstep with the bwa-mem3 crates. pyproject.toml
# declares the project version `dynamic`, so maturin reads this resolved value
# for the wheel; hardcoding it here is what let the wheel fall behind a release.
version.workspace = true
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/fg-labs/bwa-mem3-rs"
authors = ["Nils Homer <nils@fulcrumgenomics.com>"]
publish = false

[lib]
name = "bwa_mem3"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Path only, deliberately: a `version` req alongside `path` is consumed solely
# when publishing to crates.io, and this crate is `publish = false`. Carrying
# one bought nothing and broke every maturin build the first time a minor bump
# landed, because `^0.1.1` cannot match 0.2.0.
bwa-mem3-rs = { path = "../bwa-mem3-rs" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
