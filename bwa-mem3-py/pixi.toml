# Development environment for the bwa-mem3 Python bindings.
# Use `pixi run develop` to build a release extension into the env, then
# `pixi run test` to run pytest. End users do not need pixi — they
# install via `pip install bwa-mem3` (once published) or build from
# source with `pip install ./bwa-mem3-py`.

[workspace]
authors = ["Nils Homer <nilshomer@gmail.com>"]
channels = ["conda-forge"]
name = "bwa-mem3-py"
platforms = ["osx-arm64", "osx-64", "linux-aarch64", "linux-64"]

[dependencies]
python = ">=3.11,<3.13"
pip = "*"
maturin = ">=1.5,<2"
pytest = ">=7"
ruff = "==0.14.9"
mypy = "==1.18.2"

[tasks]
develop = { cmd = "maturin develop --release", description = "Build & install the extension into this env" }
build   = { cmd = "maturin build --release",   description = "Build a wheel into target/wheels" }
test    = { cmd = "pytest tests -v",          depends-on = ["develop"], description = "Run pytest after rebuilding" }

# Static analysis (mirrors the Fulcrum python-template poe task set).
check-format = { cmd = "ruff format --check --diff", description = "Check Python formatting (no changes)" }
check-lint   = { cmd = "ruff check",                 description = "Lint Python (no changes)" }
check-typing = { cmd = "mypy",                       description = "Type-check Python (no changes)" }
check-all    = { depends-on = ["check-format", "check-lint", "check-typing"], description = "Run all static checks" }
fix-format   = { cmd = "ruff format",                description = "Reformat Python in place" }
fix-lint     = { cmd = "ruff check --fix",           description = "Lint and auto-fix Python in place" }
fix-all      = { depends-on = ["fix-format", "fix-lint"], description = "Apply all auto-fixes" }
