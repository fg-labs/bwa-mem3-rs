[package]
name = "bwa-mem3-rs-cli"
description = "Minimal CLI wrapping bwa-mem3-rs — aligns paired FASTQ to packed BAM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["command-line-utilities", "science"]
keywords = ["bioinformatics", "bwa", "alignment", "bam"]
readme = "README.md"

[[bin]]
name = "bwa-rs"
path = "src/main.rs"

[features]
default = []
# Passthrough to bwa-mem3-sys/debug-poison; see that crate's feature docs.
debug-poison = ["bwa-mem3-rs/debug-poison"]

[dependencies]
bwa-mem3-rs = { version = "0.3.0", path = "../bwa-mem3-rs" }
# Global allocator; the `override` feature also interposes the C `malloc`/`free`
# so the linked bwa-mem3 C++ uses mimalloc too. Rationale in main.rs.
mimalloc = { version = "0.1", features = ["override"] }
clap = { version = "4", features = ["derive"] }
noodles-fastq = "0.18"
noodles-bgzf = "0.42"
flate2 = "1"
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
rstest = "0.18"
rayon = "1"

[lints]
workspace = true
